name: Build PR

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Lint FOSS Release APK
        run: ./gradlew --console=plain assembleFossRelease :app:lintFossRelease --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOITER_APPLICATION_ID: com.loiter.music.pr.p${{ github.event.number }}
          LOITER_APP_NAME: Loiter PR ${{ github.event.number }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-release-pr-${{ github.event.number }}
          path: app/build/outputs/apk/foss/release/*.apk
